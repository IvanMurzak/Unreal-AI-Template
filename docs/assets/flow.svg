<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-label="Six steps: use the template, run init, add tools, build and test, release a source zip, install with unreal-mcp-cli. In the editor Unreal-MCP finds the plugin's tool provider and serves its tools to the AI agent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="548" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="548" fill="url(#bg)"/><rect width="1200" height="548" fill="url(#hzR)"/><rect width="1200" height="548" fill="url(#hzB)"/>
    <rect width="1200" height="548" fill="url(#dots)"/>
    <text x="40" y="56" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">FROM TEMPLATE TO INSTALLED EXTENSION</text><rect x="40" y="84" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="96" width="3" height="72" rx="1.5" fill="#FF5A73"/><text x="62" y="128.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">1  Use this template</text><text x="62" y="154.0" class="s" font-size="16" fill="#8AA6B8">a new GitHub repository</text><rect x="430" y="84" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="430" y="96" width="3" height="72" rx="1.5" fill="#FF5A73"/><text x="452" y="128.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">2  init</text><text x="452" y="154.0" class="s" font-size="16" fill="#8AA6B8">rename module, fill placeholders</text><rect x="820" y="84" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="820" y="96" width="3" height="72" rx="1.5" fill="#FF5A73"/><text x="842" y="128.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">3  Add tools</text><text x="842" y="154.0" class="s" font-size="16" fill="#8AA6B8">Registry.Tool(...) per tool</text><rect x="40" y="224" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="236" width="3" height="72" rx="1.5" fill="#6FA8D0"/><text x="62" y="268.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">4  Build &amp; test</text><text x="62" y="294.0" class="s" font-size="16" fill="#8AA6B8">UBT, Automation specs, E2E</text><rect x="430" y="224" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="430" y="236" width="3" height="72" rx="1.5" fill="#6FA8D0"/><text x="452" y="268.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">5  Release</text><text x="452" y="294.0" class="s" font-size="16" fill="#8AA6B8">version-gated source zip</text><rect x="820" y="224" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="820" y="236" width="3" height="72" rx="1.5" fill="#6FA8D0"/><text x="842" y="268.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">6  Install</text><text x="842" y="294.0" class="s" font-size="16" fill="#8AA6B8">unreal-mcp-cli install-extension</text><path id="w1" d="M380 132.0 H430" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M770 132.0 H820" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M380 272.0 H430" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M770 272.0 H820" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><path id="w5" d="M990.0 180 V202 H210.0 V224" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="3.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><text x="40" y="384" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">IN THE EDITOR</text><rect x="40" y="412" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="424" width="3" height="72" rx="1.5" fill="#FF5A73"/><text x="62" y="456.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Your plugin</text><text x="62" y="482.0" class="s" font-size="16" fill="#8AA6B8">IUnrealMcpToolProvider</text><rect x="430" y="412" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="430" y="424" width="3" height="72" rx="1.5" fill="#6FA8D0"/><text x="452" y="456.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Unreal-MCP</text><text x="452" y="482.0" class="s" font-size="16" fill="#8AA6B8">finds it as a modular feature</text><rect x="820" y="412" width="340" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="820" y="424" width="3" height="72" rx="1.5" fill="#22C55E"/><text x="842" y="456.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><text x="842" y="482.0" class="s" font-size="16" fill="#8AA6B8">calls your tools over MCP</text><path id="w6" d="M380 460 H430" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><path id="w7" d="M770 460 H820" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle>
    <rect x="0" y="546" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="547" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
