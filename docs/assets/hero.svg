<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Unreal AI Template: scaffold a C++ editor plugin that adds MCP tools to AI Game Developer (Unreal-MCP)">
  <title>Unreal AI Template: scaffold a C++ editor plugin that adds MCP tools to AI Game Developer (Unreal-MCP)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, Menlo, "Liberation Mono", monospace; }
    .fade { animation: in .9s ease-out both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- left: title block -->
    <g class="sans">
      <g class="fade d1">
        <rect x="64" y="52" width="248" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="82" cy="66" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="94" y="71" font-size="13" fill="#cbd5e1" letter-spacing=".4">GITHUB TEMPLATE REPOSITORY</text>
      </g>
      <text class="fade d2" x="62" y="140" font-size="50" font-weight="800" fill="url(#title)" letter-spacing="-1">Unreal AI Template</text>
      <text class="fade d3" x="64" y="182" font-size="21" font-weight="600" fill="#e2e8f0">Scaffold an Unreal-MCP extension plugin</text>
      <text class="fade d3" x="64" y="212" font-size="16" fill="#94a3b8">A C++ editor plugin that adds MCP tools an AI agent</text>
      <text class="fade d3" x="64" y="234" font-size="16" fill="#94a3b8">can call in the Unreal Editor. Rename, build, release.</text>
      <g class="fade d4 mono" font-size="13" font-weight="600">
        <rect x="64" y="258" width="124" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
        <text x="126" y="277" text-anchor="middle" fill="#67e8f9">Type=Editor</text>
        <rect x="198" y="258" width="120" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.5"/>
        <text x="258" y="277" text-anchor="middle" fill="#c4b5fd">C++ / UBT</text>
        <rect x="328" y="258" width="132" height="28" rx="14" fill="#e879f9" fill-opacity="0.12" stroke="#e879f9" stroke-opacity="0.45"/>
        <text x="394" y="277" text-anchor="middle" fill="#f0abfc">source zip</text>
      </g>
    </g>

    <!-- right: code card -->
    <g class="fade d3">
      <rect x="640" y="44" width="500" height="232" rx="14" fill="#0b1020" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="662" cy="64" r="5" fill="#f87171" fill-opacity=".85"/>
      <circle cx="678" cy="64" r="5" fill="#fbbf24" fill-opacity=".85"/>
      <circle cx="694" cy="64" r="5" fill="#34d399" fill-opacity=".85"/>
      <text x="1124" y="68" text-anchor="end" class="mono" font-size="12" fill="#64748b">&lt;Module&gt;Module.cpp</text>
      <g class="mono" font-size="15">
        <text x="664" y="108" fill="#e2e8f0">Registry.<tspan fill="#67e8f9">Tool</tspan>(<tspan fill="#86efac">"hello-extension"</tspan>)</text>
        <text x="682" y="134" fill="#e2e8f0">.<tspan fill="#67e8f9">Title</tspan>(<tspan fill="#86efac">"Sample tool"</tspan>)</text>
        <text x="682" y="160" fill="#e2e8f0">.<tspan fill="#67e8f9">ParamString</tspan>(<tspan fill="#86efac">"name"</tspan>, ...)</text>
        <text x="682" y="186" fill="#e2e8f0">.<tspan fill="#67e8f9">Handle</tspan>([](<tspan fill="#c4b5fd">const</tspan> FUnrealMcpToolCall&amp; Call)</text>
        <text x="682" y="212" fill="#e2e8f0">{ <tspan fill="#64748b">/* editor APIs, game thread */</tspan> });</text>
        <text x="664" y="250" fill="#64748b">// Unreal-MCP picks it up live</text>
        <rect class="caret" x="942" y="237" width="9" height="17" fill="#67e8f9"/>
      </g>
    </g>
  </g>
</svg>
